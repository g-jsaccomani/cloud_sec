name: 🛡️ Multi-Cloud Security Requirements Extraction (Cron / Automated)

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions UI

permissions:
  contents: write
  id-token: write  # Required for OIDC / Workload Identity Federation

jobs:
  extract-security-posture:
    name: Run Cloud Security Extractor across GCP, AWS, Azure, OCI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: Uncomment and configure Workload Identity Federation for live multi-cloud credentials
      # - name: Authenticate to GCP via Workload Identity Federation
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      #     service_account: 'security-auditor-sa@my-org.iam.gserviceaccount.com'

      # - name: Authenticate to AWS via OIDC
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/github-security-auditor-role
      #     aws-region: us-east-1

      - name: Execute Multi-Cloud Security Extraction & Generate Master Documentation
        run: |
          echo "Executing Multi-Cloud Security Extractor across 10 Towers..."
          # By default runs in architectural mock/sample mode if live credentials are not provided
          python3 main.py --cloud ALL --domain all --output-dir ./docs
          echo "Extraction and documentation build completed successfully."

      - name: Commit and Push Updated Security Documentation Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No documentation changes detected. Skipping commit."
          else
            git commit -m "docs: automated update of multi-cloud security documentation [skip ci]"
            git push
          fi
