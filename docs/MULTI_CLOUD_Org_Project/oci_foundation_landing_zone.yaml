cloud_provider: OCI
count: 4
domain: foundation_landing_zone
items:
- category: Compartment Hierarchy
  control_name: Enforce OCI Enterprise Landing Zone Compartment Architecture
  current_value: Enterprise Landing Zone hierarchy deployed under root tenancy
  description: 'The OCI tenancy must deploy standardized compartments: Security, Network,
    AppDev (Prod, Non-Prod), and Database with policy inheritance boundaries.'
  evidence_source: oci iam compartment list
  id: OCI-LZ-001
  recommended_value: Standardized OCI Landing Zone compartment structure with zero
    workloads in root compartment
  remediation_notes: Ensure no compute or database resources are provisioned directly
    in the root compartment.
  severity: CRITICAL
  status: COMPLIANT
- category: Network Hub Architecture
  control_name: Enforce Dynamic Routing Gateway (DRG) Hub-and-Spoke Transit Architecture
  current_value: DRG 'drg-hub-prod' attached to 8 spoke VCNs with inspection routing
  description: Spoke VCNs must connect to an OCI Dynamic Routing Gateway (DRG) with
    route table isolation preventing direct spoke-to-spoke bypass without inspection.
  evidence_source: oci network drg-attachment list
  id: OCI-LZ-002
  recommended_value: 100% spoke VCNs attached to centralized DRG hub
  remediation_notes: Audit DRG route import and export distribution lists quarterly.
  severity: HIGH
  status: COMPLIANT
- category: Tenancy Administration
  control_name: Restrict Tenancy Administrators Group Membership
  current_value: 3 emergency break-glass accounts in 'Administrators' group
  description: The built-in 'Administrators' group must contain fewer than 5 members,
    exclusively emergency break-glass accounts protected by MFA.
  evidence_source: oci iam group list-users --group-id <ADMIN_GROUP_ID>
  id: OCI-LZ-003
  recommended_value: Max 3 break-glass administrators; enforce least-privilege IAM
    groups for day-to-day operations
  remediation_notes: Review group membership logs weekly in Cloud Guard.
  severity: CRITICAL
  status: COMPLIANT
- category: Centralized Logging
  control_name: Enforce Dedicated Security Compartment for Logging Analytics & Audit
    Buckets
  current_value: Central logs exported to 'Security_Core' compartment with restricted
    IAM write access
  description: All tenancy Audit Logs and VCN Flow Logs must export to an Object Storage
    bucket and Logging Analytics log group inside a dedicated 'Security_Core' compartment.
  evidence_source: oci iam compartment list --name Security_Core
  id: OCI-LZ-004
  recommended_value: Dedicated Security compartment with immutable bucket retention
  remediation_notes: Verify object versioning and retention rules on central audit
    bucket.
  severity: CRITICAL
  status: COMPLIANT
