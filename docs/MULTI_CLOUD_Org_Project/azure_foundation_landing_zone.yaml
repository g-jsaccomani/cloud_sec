cloud_provider: AZURE
count: 4
domain: foundation_landing_zone
items:
- category: Management Group Architecture
  control_name: Enforce Azure CAF Enterprise-Scale Management Group Hierarchy
  current_value: Enterprise-Scale Management Group hierarchy deployed under 'mg-enterprise-root'
  description: 'The Azure tenant must deploy standardized Management Groups: Platform
    (Identity, Connectivity, Management), LandingZones (Prod, Non-Prod), and Decommissioned.'
  evidence_source: az account management-group list
  id: AZURE-LZ-001
  recommended_value: Standardized CAF Enterprise-Scale hierarchy with policy inheritance
  remediation_notes: Verify no resources or subscriptions exist directly under the
    Root Management Group.
  severity: CRITICAL
  status: COMPLIANT
- category: Network Connectivity Hub
  control_name: Enforce Hub-and-Spoke / Azure Virtual WAN Centralized Transit Architecture
  current_value: 14 spoke VNets peered to 'vnet-hub-prod' with forced tunneling through
    Azure Firewall
  description: Spoke VNets in Landing Zone subscriptions must connect to a centralized
    Connectivity Hub VNet/vWAN with Azure Firewall inspection.
  evidence_source: az network vnet peering list
  id: AZURE-LZ-002
  recommended_value: 100% of spoke VNets connected to Connectivity Hub with zero direct
    internet egress
  remediation_notes: Audit User Defined Routes (UDRs) on spoke subnets for 0.0.0.0/0
    pointing to firewall IP.
  severity: HIGH
  status: COMPLIANT
- category: Subscription Democracy
  control_name: Enforce Subscription Democratization via Azure Landing Zone Vendoring
  current_value: Dedicated subscriptions provisioned for 'AppCore-Prod', 'AppCore-Dev',
    and 'DataLake-Prod'
  description: Workloads must be separated into dedicated subscriptions per application/environment
    to isolate blast radiuses and billing.
  evidence_source: az account list
  id: AZURE-LZ-003
  recommended_value: 100% workload isolation via dedicated Landing Zone subscriptions
  remediation_notes: Use Azure Blueprints or Bicep modules for subscription vending.
  severity: HIGH
  status: COMPLIANT
- category: Platform Operations
  control_name: Enforce Dedicated Management Subscription for Central Log Analytics
    Workspace
  current_value: Log Analytics workspace 'law-secops-central' isolated in 'sub-platform-management'
  description: Security logs and Sentinel SIEM must reside in a dedicated Management/Platform
    subscription with restricted Entra ID RBAC.
  evidence_source: az account list --query [?name=='sub-platform-management']
  id: AZURE-LZ-004
  recommended_value: Dedicated platform management subscription with least-privilege
    SOC access
  remediation_notes: Enforce MFA and PIM JIT for any write operations to the Management
    subscription.
  severity: CRITICAL
  status: COMPLIANT
