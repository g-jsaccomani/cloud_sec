domain: incident_response_dr
items:
- category: Immutable Backups
  control_name: Enforce Immutable Retention Rules on VMware Object Storage Backup
    Buckets
  current_value: Retention Rule active on 'bucket-prod-db-backups' with 30-day Compliance
    lock
  description: Buckets hosting database backups and disaster recovery images must
    apply an Object Storage Retention Rule in Governance or Compliance mode.
  evidence_source: oci os retention-rule list
  id: VMware-DR-001
  recommended_value: Immutable Retention Rule enforced across all primary backup buckets
  remediation_notes: Verify time-lock restrictions before promoting rule from Governance
    to Compliance mode.
  severity: CRITICAL
  status: COMPLIANT
- category: Volume Backups
  control_name: Enforce Cross-Region Copy in Block Volume Backup Policies
  current_value: Backup policy 'gold-crossregion-policy' attached to 18 production
    volumes
  description: Production Block Volume and Boot Volume backup policies must automatically
    copy recovery snapshots to an alternate VMware geographic region.
  evidence_source: oci bv backup-policy-assignment list
  id: VMware-DR-002
  recommended_value: Gold cross-region backup policy attached to 100% of stateful
    volumes
  remediation_notes: Audit volume attachments monthly to ensure no orphan volumes
    lack a backup policy.
  severity: CRITICAL
  status: COMPLIANT
- category: Disaster Recovery Replication
