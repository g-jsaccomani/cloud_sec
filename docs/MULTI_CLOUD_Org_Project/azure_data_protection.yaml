cloud_provider: AZURE
count: 4
domain: data_protection
items:
- category: Storage Account Security
  control_name: Disable Blob Public Access on All Storage Accounts
  current_value: 12 accounts have allowBlobPublicAccess = false; 1 account set to
    true
  description: Storage accounts must have 'allowBlobPublicAccess' set to false to
    prevent anonymous read access.
  evidence_source: az storage account list
  id: AZURE-DATA-001
  recommended_value: allowBlobPublicAccess = false across 100% of accounts
  remediation_notes: Run 'az storage account update --name <name> --allow-blob-public-access
    false'.
  severity: CRITICAL
  status: NON_COMPLIANT
- category: Key Vault Security
  control_name: Enforce Soft-Delete and Purge Protection on Azure Key Vaults
  current_value: Soft-delete enabled on 100% of vaults; Purge Protection disabled
    on 'kv-dev-keys'
  description: Key Vaults must have both soft-delete (90 days retention) and purge
    protection enabled.
  evidence_source: az keyvault list
  id: AZURE-DATA-002
  recommended_value: Soft-Delete = True, Purge Protection = True
  remediation_notes: Enable purge protection on 'kv-dev-keys' to protect against malicious
    key deletion.
  severity: HIGH
  status: NON_COMPLIANT
- category: Database Security
  control_name: Enforce Transparent Data Encryption (TDE) with Customer Managed Keys
    on Azure SQL
  current_value: TDE enabled with Microsoft-managed keys
  description: Azure SQL databases must use TDE with Customer Managed Keys (CMK) stored
    in Azure Key Vault.
  evidence_source: az sql db tde show
  id: AZURE-DATA-003
  recommended_value: TDE enabled with Key Vault Customer-Managed Key (CMK)
  remediation_notes: Evaluate requirement for Customer Managed Key TDE versus platform
    default encryption.
  severity: MEDIUM
  status: MANUAL_REVIEW
- category: Storage Security
  control_name: Enforce Minimum TLS Version 1.2 on All Storage Accounts
  current_value: 100% of Storage Accounts require TLS 1.2
  description: Storage account connections must enforce minimumTlsVersion = 'TLS1_2'.
  evidence_source: az storage account list
  id: AZURE-DATA-004
  recommended_value: minimumTlsVersion = 'TLS1_2'
  remediation_notes: Verify client compatibility with TLS 1.3 as it becomes available.
  severity: HIGH
  status: COMPLIANT
