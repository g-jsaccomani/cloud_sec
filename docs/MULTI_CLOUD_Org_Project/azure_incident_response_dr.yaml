cloud_provider: AZURE
count: 4
domain: incident_response_dr
items:
- category: Immutable Backups
  control_name: Enforce Immutable Vault Protection on Azure Backup Recovery Services
    Vaults
  current_value: Vault 'rsv-prod-core' has ImmutabilityState = 'Locked' and SoftDelete
    = Enabled
  description: Recovery Services and Backup vaults must enable Immutability (WORM)
    and Soft Delete (14+ days) to protect against ransomware backup deletion.
  evidence_source: az backup vault show
  id: AZURE-DR-001
  recommended_value: ImmutabilityState = 'Locked' across all production backup vaults
  remediation_notes: Verify backup restore points across paired geographic regions.
  severity: CRITICAL
  status: COMPLIANT
- category: Forensic Readiness
  control_name: Configure Automated Forensic Snapshot Isolation Runbooks in Azure
    Automation
  current_value: Runbook 'IR-Forensic-Disk-Snapshot' linked to Defender Critical Alerts
  description: Incident response workflows must use Azure Automation runbooks to automatically
    snapshot and isolate VM disks upon Sentinel/Defender critical alert.
  evidence_source: az automation runbook list
  id: AZURE-DR-002
  recommended_value: Automated forensic runbook active across 100% of production subscriptions
  remediation_notes: Test forensic snapshot automation during quarterly incident response
    drills.
  severity: HIGH
  status: COMPLIANT
- category: Disaster Recovery Replication
  control_name: Enforce Azure Site Recovery (ASR) with Customer Managed Keys for Critical
    VMs
  current_value: ASR replication active for 10 Tier-0 VMs; encryption uses Microsoft-managed
    key
  description: Tier-0 VMs replicated via Azure Site Recovery must encrypt replication
    cache and target disks using Key Vault Customer Managed Keys.
  evidence_source: az site-recovery fabric list
  id: AZURE-DR-003
  recommended_value: ASR replication encrypted with Customer Managed Key (CMK)
  remediation_notes: Assign Key Vault CMK to Azure Site Recovery replication vault.
  severity: HIGH
  status: NON_COMPLIANT
- category: Incident Response Access
  control_name: Enforce Emergency Break-Glass Accounts with Monitored Sign-in Alerts
  current_value: 2 break-glass accounts configured; Sentinel alert 'Alert-BreakGlass-Usage'
    active
  description: Two emergency break-glass Entra ID global admin accounts must exist
    without Conditional Access MFA dependencies, monitored 24/7 by Azure Sentinel
    alerts.
  evidence_source: az monitor metrics alert list
  id: AZURE-DR-004
  recommended_value: 2 monitored break-glass accounts with quarterly password rotation
    in fireproof safe
  remediation_notes: Verify break-glass accounts are excluded from federation (native
    cloud-only accounts).
  severity: CRITICAL
  status: COMPLIANT
